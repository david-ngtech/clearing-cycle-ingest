[project]
name = "clearing-cycle-ingest"
version = "0.1.0"
description = "Clearing-cycle ingest fabric: IPM-like files, FX/BIN APIs, member catalog, parquet backfill."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "httpx>=0.27.0",
  "pyarrow>=18.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clearing_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
